services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfa-analytics-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${USERPROFILE}/.aws/config:/root/.aws/config:ro
      - ${USERPROFILE}/.aws/sso/cache:/root/.aws/sso/cache
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_SDK_LOAD_CONFIG: "1"
      ALFA_AWS_PRINCIPAL_ARN: ${ALFA_AWS_PRINCIPAL_ARN:-}
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alfa-analytics-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    
  database:
    image: postgres:17-alpine
    container_name: alfa-analytics-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - alfa_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  alfa_postgres_data: